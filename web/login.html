<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<title>登录 · Traffic Burner</title>
<style>
  :root {
    --bg0: #0b0f1a; --bg1: #141a2b;
    --glass: rgba(255,255,255,.06); --glass2: rgba(255,255,255,.09);
    --text: #eef2ff; --dim: #9aa4c4; --acc: #6d8bff; --acc2: #9b7bff; --warn: #ffb84d; --err: #ff5c7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(900px 600px at 25% 15%, #1c2b56 0%, transparent 55%),
                radial-gradient(800px 500px at 80% 85%, #3a1b56 0%, transparent 55%),
                linear-gradient(160deg, var(--bg0), var(--bg1));
    color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 380px; background: var(--glass); backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border-radius: 22px; padding: 34px;
    box-shadow: 0 24px 60px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
  }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 22px; background: linear-gradient(90deg,#8fb0ff,#c08bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
  .field label { font-size: 12px; color: var(--dim); }
  input {
    background: rgba(0,0,0,.28); border: none; outline: none; color: var(--text);
    border-radius: 12px; padding: 11px 14px; font-size: 14px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); transition: box-shadow .15s;
  }
  input:focus { box-shadow: inset 0 0 0 1px var(--acc), 0 0 0 3px rgba(109,139,255,.18); }
  .code-row { display: flex; gap: 8px; align-items: center; }
  .code-row input { flex: 1; }
  .btn {
    border: none; border-radius: 14px; padding: 12px 24px; font-size: 14px; font-weight: 700; cursor: pointer;
    color: #fff; transition: transform .14s, box-shadow .14s, filter .14s;
    box-shadow: 0 10px 24px rgba(0,0,0,.3);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { width: 100%; background: linear-gradient(135deg,#5b7aff,#9b7bff); }
  .btn.primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(109,139,255,.4); }
  .btn.ghost { background: var(--glass2); color: var(--dim); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  .btn.ghost:hover:not(:disabled) { color: var(--text); }
  .btn.mini { padding: 9px 14px; font-size: 12px; }
  .err { color: var(--err); font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
<div class="card">
  <h1>🔥 Traffic Burner</h1>
  <div class="field"><label>用户名</label><input type="text" id="lgUser"></div>
  <div class="field"><label>密码</label><input type="password" id="lgPass"></div>
  <div class="field"><label>Telegram 验证码</label>
    <div class="code-row">
      <input type="text" id="lgCode" maxlength="6">
      <button class="btn ghost mini" id="btnGetCode">获取验证码</button>
    </div>
  </div>
  <button class="btn primary" id="lgBtn">登 录</button>
  <div class="err" id="lgErr"></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

// 已登录则直接跳回主页
if (localStorage.getItem("tb_token")) { location.href = "/"; }

async function getCode() {
  const btn = $("btnGetCode"); btn.disabled = true; btn.textContent = "发送中…";
  try {
    const res = await fetch("/api/login-code", { method: "POST" });
    const j = await res.json();
    if (j.ok) { btn.textContent = "已发送"; setTimeout(()=>{btn.disabled=false;btn.textContent="重新获取";},2000); }
    else { $("lgErr").textContent = j.error || "发送失败"; btn.disabled=false; btn.textContent="获取验证码"; }
  } catch(e){ $("lgErr").textContent = "无法连接服务器"; btn.disabled=false; btn.textContent="获取验证码"; }
}
async function doLogin() {
  const user = $("lgUser").value.trim(), pass = $("lgPass").value, code = $("lgCode").value.trim();
  if (!user || !pass || !code) { $("lgErr").textContent = "请填写用户名、密码和验证码"; return; }
  try {
    const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user, pass, code }) });
    const j = await res.json();
    if (!j.ok) { $("lgErr").textContent = j.error || "登录失败"; return; }
    localStorage.setItem("tb_token", j.token);
    location.href = "/";
  } catch(e){ $("lgErr").textContent = "无法连接服务器"; }
}
$("lgBtn").onclick = doLogin;
$("btnGetCode").onclick = getCode;
$("lgCode").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
$("lgPass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
</script>
</body>
</html>
