services:
  traffic-burner:
    image: traffic-burner:latest
    build: .
    container_name: traffic-burner
    restart: unless-stopped
    ports:
      - "${TB_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      AUTH_USER: "${TB_USER:-admin}"
      AUTH_PASS: "${TB_PASS:-changeme}"
      TG_BOT_TOKEN: "${TG_BOT_TOKEN:-}"
      TG_CHAT_ID: "${TG_CHAT_ID:-}"
    volumes:
      - ./data:/data
