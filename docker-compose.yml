services:
  traffic-burner:
    image: traffic-burner:latest
    build: .
    container_name: traffic-burner
    restart: unless-stopped
    ports:
      - "${TB_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      AUTH_USER: "${TB_USER:-admin}"
      AUTH_PASS: "${TB_PASS:-changeme}"
    # 少数场景可改用 host 网络让服务端直发发挥最大带宽（需自行取消注释）
    # network_mode: host
